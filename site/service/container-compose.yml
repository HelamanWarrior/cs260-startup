services:
  dev-mongodb:
    image: docker.io/library/mongo:8
    container_name: startup-mongodb
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - dev-mongodata:/data/db

volumes:
  dev-mongodata:
