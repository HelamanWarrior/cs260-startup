<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Liquid Notes</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body class="bg-neutral-50 pb-24 text-neutral-900 antialiased">
    <header class="mx-auto max-w-3xl px-4 pt-8 text-center sm:px-6 sm:pt-12">
      <img src="/placeholder.png" alt="Liquid Notes logo"
				  class="mx-auto h-auto w-40 sm:w-56" />
    </header>
    <main class="mx-auto max-w-3xl px-4 py-8 sm:px-6 sm:py-12">
      <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">Home</h1>
      <p class="mt-4 text-lg leading-relaxed text-neutral-600">Deepen your roots of knowledge:</p>
      <button>Record a Drop</button>
      <div>
	<p>[Live transcription data goes here (websockets)]</p>
      </div>
    </main>
    <nav class="fixed bottom-4 left-1/2 z-50 -translate-x-1/2">
      <ul class="flex items-center gap-1 rounded-full bg-white/70 p-1.5 shadow-lg ring-1 ring-black/10 backdrop-blur-md">
	<li>
	  <a href="/" aria-current="page"
	    class="block rounded-full px-4 py-2 text-sm font-medium text-neutral-700 transition hover:bg-black/5 aria-[current=page]:bg-neutral-900 aria-[current=page]:text-white">
	    Home
	  </a>
	</li>
	<li>
	  <a href="/search/"
	     class="block rounded-full px-4 py-2 text-sm font-medium text-neutral-700 transition hover:bg-black/5 aria-[current=page]:bg-neutral-900 aria-[current=page]:text-white">
	    Search
	  </a>
	</li>
	<li>
	  <a href="/about/"
	     class="block rounded-full px-4 py-2 text-sm font-medium text-neutral-700 transition hover:bg-black/5 aria-[current=page]:bg-neutral-900 aria-[current=page]:text-white">
	    About
	  </a>
	</li>
	<li>
	  <a href="/account/"
	     class="block rounded-full px-4 py-2 text-sm font-medium text-neutral-700 transition hover:bg-black/5 aria-[current=page]:bg-neutral-900 aria-[current=page]:text-white">
	    Account
	  </a>
	</li>
      </ul>
    </nav>
    <footer class="fixed bottom-4 right-4 z-40 hidden md:block">
      <a href="https://github.com/HelamanWarrior/cs260-startup"
	target="_blank" rel="noopener noreferrer"
	class="block rounded-full bg-white/70 px-4 py-2 text-sm font-medium text-neutral-700 shadow-lg ring-1 ring-black/10 backdrop-blur-md transition hover:bg-white hover:text-neutral-900">
	Source code
      </a>
    </footer>
  </body>
</html>
