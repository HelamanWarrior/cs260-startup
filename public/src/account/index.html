<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Liquid Notes - My Account</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body class="bg-neutral-50 pb-24 text-neutral-900 antialiased">
    <header class="mx-auto max-w-3xl px-4 pt-8 text-center sm:px-6 sm:pt-12">
      <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">Account</h1>
    </header>
    <main class="mx-auto max-w-3xl space-y-8 px-4 py-8 sm:px-6 sm:py-12">
      <form action="#" method="POST"
	    class="mx-auto w-full max-w-md space-y-5 rounded-2xl bg-white p-6 shadow-sm ring-1 ring-black/5 sm:p-8">
	<div>
	  <label for="username" class="block text-sm font-medium text-neutral-700">Username</label>
	  <input type="text" id="username" name="username" required autocomplete="username"
		 class="mt-1.5 block w-full rounded-xl bg-neutral-50 px-4 py-3 text-base ring-1 ring-black/10
			placeholder:text-neutral-400 focus:outline-none focus:ring-2 focus:ring-sky-500" />
	</div>

	<div>
	  <label for="password" class="block text-sm font-medium text-neutral-700">Password</label>
	  <input type="password" id="password" name="password" required autocomplete="current-password"
		 class="mt-1.5 block w-full rounded-xl bg-neutral-50 px-4 py-3 text-base ring-1 ring-black/10
			placeholder:text-neutral-400 focus:outline-none focus:ring-2 focus:ring-sky-500" />
	</div>

	<button type="submit"
		class="w-full rounded-full bg-sky-600 px-6 py-3.5 text-lg font-semibold text-white
		       shadow-md shadow-sky-600/30 transition hover:bg-sky-700 active:scale-95
		       focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-sky-300">
	  Log In
	</button>
      </form>

      <section class="flex justify-center gap-6 text-sm font-medium">
	<a href="#" class="text-sky-600 underline-offset-2 hover:underline">Change password</a>
	<a href="#" class="text-neutral-500 underline-offset-2 hover:text-red-600 hover:underline">Log out</a>
      </section>
    </main>
    <footer class="fixed bottom-4 right-4 z-40 hidden md:block">
      <a href="https://github.com/HelamanWarrior/cs260-startup"
	 target="_blank" rel="noopener noreferrer"
			 class="block rounded-full bg-white/70 px-4 py-2 text-sm font-medium text-neutral-700 shadow-lg ring-1 ring-black/10 backdrop-blur-md transition hover:bg-white hover:text-neutral-900">
	Source code
      </a>
    </footer>
    <nav class="fixed bottom-4 left-1/2 z-50 -translate-x-1/2">
      <ul class="flex items-center gap-1 rounded-full bg-white/70 p-1.5 shadow-lg ring-1 ring-black/10 backdrop-blur-md">
	<li>
	  <a href="/"
	     class="block rounded-full px-4 py-2 text-sm font-medium text-neutral-700 transition hover:bg-black/5 aria-[current=page]:bg-neutral-900 aria-[current=page]:text-white">
	    Home
	  </a>
	</li>
	<li>
	  <a href="/search/"
	     class="block rounded-full px-4 py-2 text-sm font-medium text-neutral-700 transition hover:bg-black/5 aria-[current=page]:bg-neutral-900 aria-[current=page]:text-white">
	    Search
	  </a>
	</li>
	<li>
	  <a href="/about/"
	     class="block rounded-full px-4 py-2 text-sm font-medium text-neutral-700 transition hover:bg-black/5 aria-[current=page]:bg-neutral-900 aria-[current=page]:text-white">
	    About
	  </a>
	</li>
	<li>
	  <a href="/account/" aria-current="page"
	    class="block rounded-full px-4 py-2 text-sm font-medium text-neutral-700 transition hover:bg-black/5 aria-[current=page]:bg-neutral-900 aria-[current=page]:text-white">
	    Account
	  </a>
	</li>
      </ul>
    </nav>
  </body>
</html>
