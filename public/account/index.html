<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Liquid Notes - My Account</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body class="pb-24">
    <header>
      <h1>My Account</h1>
      <nav class="fixed bottom-4 left-1/2 z-50 -translate-x-1/2">
	<ul class="flex items-center gap-1 rounded-full bg-white/70 p-1.5 shadow-lg ring-1 ring-black/10 backdrop-blur-md">
	  <li>
	    <a href="/"
		class="block rounded-full px-4 py-2 text-sm font-medium text-neutral-700 transition hover:bg-black/5 aria-[current=page]:bg-neutral-900 aria-[current=page]:text-white">
	      Home
	    </a>
	  </li>
	  <li>
	    <a href="/search/"
	       class="block rounded-full px-4 py-2 text-sm font-medium text-neutral-700 transition hover:bg-black/5 aria-[current=page]:bg-neutral-900 aria-[current=page]:text-white">
	      Search
	    </a>
	  </li>
	  <li>
	    <a href="/about/"
	      class="block rounded-full px-4 py-2 text-sm font-medium text-neutral-700 transition hover:bg-black/5 aria-[current=page]:bg-neutral-900 aria-[current=page]:text-white">
	      About
	    </a>
	  </li>
	  <li>
	    <a href="/account/" aria-current="page"
	      class="block rounded-full px-4 py-2 text-sm font-medium text-neutral-700 transition hover:bg-black/5 aria-[current=page]:bg-neutral-900 aria-[current=page]:text-white">
	      Account
	    </a>
	  </li>
	</ul>
      </nav>
      <hr />
    </header>
    <main>
      <form action="#" method="POST">
	<div>
	  <label for="username">Username: </label>
	  <input type="text" id="username" name="username" required>
	</div>
	<div>
	  <label for="password">Password: </label>
	  <input type="password" id="password" name="password" required>
	</div>
	<div>
	  <button type="submit">Log In</button>
	</div>
      </form>
      <section>
	<p><a href="#">Change password</a></p>
	<p><a href="#">Log out</a></p>
      </section>
    </main>
    <footer>
      <p><a href="https://github.com/HelamanWarrior/cs260-startup" target="_blank" rel="noopener noreferrer">Source code</a></p>
    </footer>
  </body>
</html>
